name: Backup D1 semanal - CSV completo

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  backup-csv-completo:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Exportar tablas a CSV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p backups/semanal
          FECHA=$(date +'%Y-%m-%d')

          for TABLA in turnos inscripciones personas personas_anteriores opciones
          do
            npx wrangler d1 execute barraka-db --remote --command="SELECT * FROM $TABLA;" --json > ./backups/semanal/$TABLA-$FECHA.json
            node scripts/json-d1-to-csv.js ./backups/semanal/$TABLA-$FECHA.json ./backups/semanal/$TABLA-$FECHA.csv
          done

      - name: Guardar CSV semanal como artifact
        uses: actions/upload-artifact@v4
        with:
          name: barraka-db-csv-semanal
          path: backups/semanal/*.csv
          retention-days: 90
