name: Backup D1 semanal - completo

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  backup-completo:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Exportar base completa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p backups/semanal
          FECHA=$(date +'%Y-%m-%d')
          npx wrangler d1 export barraka-db --remote --output=./backups/semanal/barraka-db-completo-$FECHA.sql

      - name: Guardar backup semanal como artifact
        uses: actions/upload-artifact@v4
        with:
          name: barraka-db-completo-semanal
          path: backups/semanal/*.sql
          retention-days: 90
