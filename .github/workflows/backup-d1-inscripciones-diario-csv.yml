name: Backup D1 diario - inscripciones CSV

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  backup-inscripciones-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Exportar inscripciones a CSV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p backups/diario
          FECHA=$(date +'%Y-%m-%d')
          npx wrangler d1 execute barraka-db --remote --command="SELECT * FROM inscripciones ORDER BY fecha_creacion DESC;" --json > ./backups/diario/inscripciones-$FECHA.json
          node scripts/json-d1-to-csv.js ./backups/diario/inscripciones-$FECHA.json ./backups/diario/inscripciones-$FECHA.csv

      - name: Guardar CSV diario como artifact
        uses: actions/upload-artifact@v4
        with:
          name: inscripciones-csv-diario
          path: backups/diario/*.csv
          retention-days: 30
