<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel de Gestión · Barraka Txandak</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --teal:#00b4b4; --teal-dk:#008a8a; --teal-ink:#005f8a; --teal-lt:#e0f7f7;
      --bg:#f2f4f6; --card:#ffffff; --text:#111827; --muted:#6b7280; --line:#d1d5db;
      --danger:#dc2626; --danger-lt:#fef2f2; --warn:#d97706; --warn-lt:#fef3c7;
      --ok:#15803d; --ok-lt:#dcfce7; --blue:#2563eb; --blue-lt:#dbeafe;
      --radius:18px; --shadow:0 18px 44px rgba(15,23,42,.09); --soft:0 8px 22px rgba(15,23,42,.06);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      min-height:100vh; font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background: radial-gradient(circle at 12% 0%, rgba(0,180,180,.18), transparent 34rem), linear-gradient(180deg,#f7fbfb 0%,var(--bg) 44%,#eef2f4 100%);
      color:var(--text); -webkit-font-smoothing:antialiased;
    }
    button, input { font:inherit; }
    button { cursor:pointer; }
    .hidden { display:none !important; }

    #loginScreen { min-height:100vh; display:grid; place-items:center; padding:24px; background:linear-gradient(135deg,var(--teal) 0%,var(--teal-ink) 100%); }
    .login-box { width:min(420px, 94vw); background:#fff; border-radius:28px; padding:42px 38px; box-shadow:0 28px 80px rgba(0,0,0,.24); text-align:center; }
    .login-logo { font-size:3rem; margin-bottom:8px; }
    .login-box h1 { color:var(--teal-dk); font-size:1.65rem; font-weight:900; letter-spacing:-.04em; }
    .login-box p { color:var(--muted); margin:8px 0 26px; line-height:1.45; }
    .login-box input { width:100%; border:2px solid var(--line); border-radius:14px; padding:13px 16px; text-align:center; font-family:'DM Mono',monospace; letter-spacing:.12em; font-size:1.05rem; outline:none; }
    .login-box input:focus { border-color:var(--teal); box-shadow:0 0 0 4px rgba(0,180,180,.12); }
    .login-box button { width:100%; margin-top:14px; border:0; border-radius:14px; padding:13px 18px; background:var(--teal); color:#fff; font-weight:850; }
    .login-box button:hover { background:var(--teal-dk); }
    .login-error { min-height:20px; margin-top:12px; color:var(--danger); font-weight:750; font-size:.9rem; }

    #app { display:none; }
    header { color:#fff; background:linear-gradient(135deg,var(--teal) 0%,var(--teal-ink) 100%); padding:18px 28px; box-shadow:0 14px 34px rgba(0,95,138,.18); }
    .header-inner { max-width:1280px; margin:0 auto; display:flex; justify-content:space-between; gap:16px; align-items:center; flex-wrap:wrap; }
    .brand { display:flex; gap:12px; align-items:center; }
    .brand-icon { width:46px; height:46px; display:grid; place-items:center; border-radius:16px; background:rgba(255,255,255,.18); font-size:1.65rem; }
    .brand h1 { font-size:1.35rem; line-height:1.1; letter-spacing:-.035em; font-weight:900; }
    .brand small { display:block; margin-top:4px; opacity:.82; font-size:.78rem; letter-spacing:.08em; font-weight:600; }
    .header-actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    #lastUpdate { font-family:'DM Mono',monospace; font-size:.78rem; opacity:.88; }
    .header-btn { border:1.5px solid rgba(255,255,255,.42); background:rgba(255,255,255,.16); color:#fff; border-radius:999px; padding:8px 15px; font-weight:800; text-decoration:none; }
    .header-btn:hover { background:rgba(255,255,255,.28); }

    main { width:min(1280px, calc(100% - 36px)); margin:18px auto 46px; }
    .view-tabs { display:flex; gap:8px; margin:16px 0; padding:6px; background:rgba(255,255,255,.82); border:1px solid var(--line); border-radius:999px; width:max-content; box-shadow:var(--soft); }
    .view-tab { border:0; border-radius:999px; padding:10px 18px; background:transparent; color:var(--muted); font-weight:900; }
    .view-tab.active { background:var(--teal); color:#fff; box-shadow:0 8px 18px rgba(0,180,180,.18); }

    .loading { display:grid; place-items:center; gap:14px; padding:80px 20px; color:var(--muted); font-weight:750; }
    .spinner { width:42px; height:42px; border:4px solid var(--teal-lt); border-top-color:var(--teal); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .error-box { background:var(--danger-lt); color:var(--danger); border:1px solid #fecaca; border-radius:18px; padding:18px 20px; font-weight:800; }

    .kpi-grid { display:grid; grid-template-columns:repeat(4,minmax(160px,1fr)); gap:12px; margin:12px 0 16px; }
    .kpi { background:#fff; border:1px solid var(--line); border-radius:22px; padding:18px; box-shadow:var(--soft); position:relative; overflow:hidden; }
    .kpi::after { content:""; position:absolute; right:-34px; top:-42px; width:105px; height:105px; border-radius:999px; background:var(--kpi-bg, var(--teal-lt)); opacity:.9; }
    .kpi-label { color:var(--muted); font-size:.86rem; font-weight:800; }
    .kpi-value { font-size:2rem; line-height:1; font-weight:950; letter-spacing:-.06em; margin-top:8px; color:var(--kpi-color,var(--teal-dk)); }
    .kpi-sub { color:var(--muted); font-size:.84rem; margin-top:6px; font-weight:650; }
    .kpi.danger { --kpi-color:var(--danger); --kpi-bg:var(--danger-lt); }
    .kpi.warn { --kpi-color:var(--warn); --kpi-bg:var(--warn-lt); }
    .kpi.ok { --kpi-color:var(--ok); --kpi-bg:var(--ok-lt); }
    .kpi.blue { --kpi-color:var(--blue); --kpi-bg:var(--blue-lt); }

    .dashboard-grid { display:grid; grid-template-columns:minmax(300px, .9fr) minmax(420px, 1.4fr); gap:14px; align-items:start; }
    .panel { background:rgba(255,255,255,.94); border:1px solid var(--line); border-radius:24px; padding:18px; box-shadow:var(--shadow); }
    .panel h2 { font-size:1.12rem; letter-spacing:-.03em; margin-bottom:6px; }
    .panel-help { color:var(--muted); line-height:1.45; font-size:.88rem; margin-bottom:12px; }

    .day-map { display:grid; grid-template-columns:1fr; gap:10px; }
    .day-card { border:1.5px solid var(--line); background:#fff; border-radius:18px; padding:14px; text-align:left; transition:.15s; }
    .day-card:hover { transform:translateY(-1px); border-color:var(--teal); box-shadow:0 10px 24px rgba(0,180,180,.10); }
    .day-card.active { border-color:var(--teal); box-shadow:inset 0 0 0 3px var(--teal-lt); }
    .day-card-head { display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
    .day-card-title { font-weight:950; }
    .day-card-date { font-family:'DM Mono',monospace; color:var(--muted); font-size:.76rem; }
    .progress { height:11px; background:#e5e7eb; border-radius:999px; overflow:hidden; margin:10px 0 7px; }
    .progress span { display:block; height:100%; width:0%; background:var(--teal); border-radius:999px; }
    .progress span.warn { background:var(--warn); }
    .progress span.danger { background:var(--danger); }
    .day-meta { display:flex; flex-wrap:wrap; gap:6px; color:var(--muted); font-size:.78rem; font-weight:700; }
    .day-meta strong { color:var(--text); }

    .urgent-list { display:grid; gap:10px; }
    .urgent-card { display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; border:1.5px solid var(--line); background:#fff; border-radius:18px; padding:13px; }
    .urgent-card.high { border-color:#fecaca; background:#fff7f7; }
    .urgent-card.medium { border-color:#fde68a; background:#fffbeb; }
    .rank { width:34px; height:34px; display:grid; place-items:center; border-radius:999px; background:var(--teal-lt); color:var(--teal-dk); font-weight:950; font-family:'DM Mono',monospace; }
    .urgent-card.high .rank { background:var(--danger); color:#fff; }
    .urgent-card.medium .rank { background:var(--warn); color:#fff; }
    .urgent-title { font-weight:950; line-height:1.25; }
    .urgent-sub { color:var(--muted); font-size:.82rem; margin-top:3px; font-weight:650; }
    .tags { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:5px; }
    .tag { border-radius:999px; padding:4px 8px; background:#f3f4f6; color:var(--muted); font-weight:900; font-size:.72rem; }
    .tag.danger { background:var(--danger-lt); color:var(--danger); }
    .tag.warn { background:var(--warn-lt); color:#92400e; }
    .empty-ok { background:var(--ok-lt); color:var(--ok); border:1px solid #86efac; border-radius:16px; padding:16px; font-weight:850; }

    .tools-row { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 16px; }
    .chip, .copy-btn { border:1.5px solid var(--line); background:#fff; color:var(--text); border-radius:999px; padding:9px 13px; font-weight:850; font-size:.86rem; }
    .chip:hover, .copy-btn:hover { border-color:var(--teal); color:var(--teal-dk); }
    .chip.active, .copy-btn.primary { background:var(--teal); border-color:var(--teal); color:#fff; }
    .copy-btn.danger { background:var(--danger); border-color:var(--danger); color:#fff; }

    .list-layout { display:grid; grid-template-columns:260px 1fr; gap:14px; align-items:start; }
    .side-nav { position:sticky; top:14px; }
    .day-tabs { display:grid; gap:8px; }
    .day-tab { width:100%; border:1.5px solid var(--line); background:#fff; border-radius:16px; padding:12px; text-align:left; font-weight:900; color:var(--text); }
    .day-tab small { display:block; color:var(--muted); font-weight:650; margin-top:3px; }
    .day-tab.active { border-color:var(--teal); background:var(--teal-lt); color:var(--teal-dk); }

    .day-section { display:none; }
    .day-section.visible { display:block; }
    .day-header { background:linear-gradient(135deg,var(--teal) 0%,var(--teal-ink) 100%); color:#fff; border-radius:24px 24px 0 0; padding:16px 20px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:baseline; }
    .day-title { font-size:1.25rem; font-weight:950; text-transform:uppercase; }
    .day-date { font-family:'DM Mono',monospace; opacity:.88; }
    .shifts-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:0; border:1.5px solid var(--teal); border-top:0; border-radius:0 0 24px 24px; overflow:hidden; background:var(--line); }
    .shift-col { background:#fff; display:flex; flex-direction:column; min-height:100%; }
    .shift-col + .shift-col { border-left:1.5px solid var(--teal); }
    .shift-col.hidden-by-filter { display:none; }
    .shift-col.need-resp { box-shadow:inset 0 0 0 4px rgba(220,38,38,.12); }
    .shift-head { background:var(--teal-lt); border-bottom:2px solid var(--teal); padding:12px 15px; display:flex; gap:8px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .shift-tipo { font-weight:950; color:var(--teal-dk); letter-spacing:.055em; text-transform:uppercase; }
    .shift-hours { font-family:'DM Mono',monospace; color:var(--teal-dk); font-weight:700; }
    .status-badge { border-radius:999px; padding:5px 9px; font-size:.75rem; font-weight:950; }
    .status-badge.ok { background:var(--ok-lt); color:var(--ok); }
    .status-badge.warn { background:var(--warn-lt); color:#92400e; }
    .status-badge.danger { background:var(--danger-lt); color:var(--danger); }
    .shift-progress { padding:10px 15px 6px; }
    .progress-label { color:var(--muted); font-size:.8rem; margin-top:5px; font-family:'DM Mono',monospace; }

    .people-table { width:100%; border-collapse:collapse; font-size:.9rem; }
    .people-table tr { border-bottom:1px solid var(--line); }
    .people-table td.num { width:38px; text-align:right; padding:8px 7px 8px 12px; color:var(--muted); font-family:'DM Mono',monospace; font-size:.8rem; }
    .people-table td.name { padding:8px 12px 8px 6px; }
    tr.row-filled { background:#fff; } tr.row-filled:hover { background:#f0fafa; }
    tr.row-resp { background:var(--teal-lt); color:var(--teal-dk); font-weight:850; }
    tr.row-empty { background:#f9fafb; color:#9ca3af; font-style:italic; }
    tr.row-empty-resp { background:var(--danger-lt); color:var(--danger); font-style:italic; }
    .resp-badge, .missing-badge { display:inline-flex; margin-left:7px; border-radius:999px; padding:2px 8px; font-size:.7rem; font-weight:950; font-style:normal; }
    .resp-badge { background:var(--teal); color:#fff; }
    .missing-badge { background:var(--danger); color:#fff; }
    .shift-actions { padding:10px 15px 4px; margin-top:auto; }
    .shift-actions .copy-btn { width:100%; }
    .shift-footer { border-top:2px solid var(--line); padding:10px 15px; display:flex; gap:10px; flex-wrap:wrap; color:var(--muted); font-size:.82rem; }
    .shift-footer strong { color:var(--text); }
    .shift-footer .danger strong { color:var(--danger); } .shift-footer .warn strong { color:var(--warn); } .shift-footer .ok strong { color:var(--ok); }

    @media (max-width:1000px) { .dashboard-grid, .list-layout { grid-template-columns:1fr; } .side-nav { position:static; } .kpi-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width:640px) { header { padding:16px; } main { width:calc(100% - 24px); } .view-tabs { width:100%; justify-content:stretch; } .view-tab { flex:1; } .kpi-grid { grid-template-columns:1fr; } .urgent-card { grid-template-columns:auto 1fr; } .tags { grid-column:2; justify-content:flex-start; } .shifts-grid { grid-template-columns:1fr; } .shift-col + .shift-col { border-left:0; border-top:1.5px solid var(--teal); } }
  </style>
</head>
<body>
  <div id="loginScreen">
    <div class="login-box">
      
      <h1>Panel de Gestión</h1>
      <p>Vista privada para revisar cobertura, huecos y responsables de los turnos.</p>
      <input type="password" id="pwdInput" placeholder="••••••••" autocomplete="current-password" />
      <button onclick="checkPassword()">Entrar</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <div id="app">
    <header>
      <div class="header-inner">
        <div class="brand">
          <div class="brand-icon">🏕️</div>
          <h1>Panel de Gestión<small>BARRAKA IKASTOLA · TXANDAK</small></h1>
        </div>
        <div class="header-actions">
          <span id="lastUpdate"></span>
          <button class="header-btn" onclick="loadData()">↻ Actualizar</button>
          <a class="header-btn" href="index.html">← Volver a la web</a>
        </div>
      </div>
    </header>

    <main>
      <div class="view-tabs" role="tablist" aria-label="Vistas del panel">
        <button class="view-tab active" id="tabSummary" onclick="setView('summary')">Resumen visual</button>
        <button class="view-tab" id="tabList" onclick="setView('list')">Listado por turnos</button>
      </div>
      <div id="summaryView"></div>
      <div id="listView" class="hidden"></div>
    </main>
  </div>

<script>
  const API_URL ="https://script.google.com/macros/s/AKfycbz9jroq7blL9XP3Zw4qm2eEz853TLWJvO_ofMMT0hwdIP7zOq-81CTxcBNOBcz74woO/exec";

  let sessionPassword = '';
  let allTurnos = [];
  let activeDayKey = null;
  let filterMode = 'all';
  let currentView = 'summary';

  async function checkPassword() {
    const val = document.getElementById('pwdInput').value;
    if (!val.trim()) return;
    const btn = document.querySelector('.login-box button');
    btn.textContent = 'Verificando…';
    btn.disabled = true;
    try {
      const res = await fetch(`${API_URL}?action=getAdminData&pwd=${encodeURIComponent(val)}`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Contraseña incorrecta.');
      sessionPassword = val;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      render(data.turnos || []);
      updateTime();
    } catch (err) {
      const errEl = document.getElementById('loginError');
      errEl.textContent = err.message;
      document.getElementById('pwdInput').value = '';
      setTimeout(() => errEl.textContent = '', 3500);
    } finally {
      btn.textContent = 'Entrar';
      btn.disabled = false;
    }
  }

  document.getElementById('pwdInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPassword(); });

  async function loadData() {
    showLoading();
    try {
      const res = await fetch(`${API_URL}?action=getAdminData&pwd=${encodeURIComponent(sessionPassword)}`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Error desconocido');
      render(data.turnos || []);
      updateTime();
    } catch (err) {
      document.getElementById('summaryView').innerHTML = `<div class="error-box">⚠ Error: ${escHtml(err.message)}</div>`;
      document.getElementById('listView').innerHTML = '';
    }
  }

  function updateTime() {
    document.getElementById('lastUpdate').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-ES');
  }

  function showLoading() {
    const html = `<div class="loading"><div class="spinner"></div><span>Cargando datos…</span></div>`;
    document.getElementById('summaryView').innerHTML = html;
    document.getElementById('listView').innerHTML = '';
  }

  function setView(view) {
    currentView = view;
    document.getElementById('tabSummary').classList.toggle('active', view === 'summary');
    document.getElementById('tabList').classList.toggle('active', view === 'list');
    document.getElementById('summaryView').classList.toggle('hidden', view !== 'summary');
    document.getElementById('listView').classList.toggle('hidden', view !== 'list');
    highlightActiveDay();
  }

  function render(turnos) {
    allTurnos = Array.isArray(turnos) ? turnos : [];
    const days = groupByDay(allTurnos);
    const dayKeys = Object.keys(days).sort();
    if (!activeDayKey || !days[activeDayKey]) activeDayKey = dayKeys[0] || null;
    renderSummary(days, dayKeys);
    renderList(days, dayKeys);
    setView(currentView);
  }

  function groupByDay(turnos) {
    const days = {};
    turnos.forEach(t => {
      const key = String(t.fecha || 'Sin fecha');
      if (!days[key]) days[key] = { dia: t.dia || key, fecha: key, turnos: [] };
      days[key].turnos.push(t);
    });
    Object.values(days).forEach(day => day.turnos.sort((a,b) => String(a.hora_inicio).localeCompare(String(b.hora_inicio))));
    return days;
  }

  function getStats(turnos) {
    const total = turnos.reduce((s,t) => s + (Number(t.plazas) || 0), 0);
    const occupied = turnos.reduce((s,t) => s + (Number(t.plazas_ocupadas) || 0), 0);
    const free = turnos.reduce((s,t) => s + (Number(t.plazas_disponibles) || 0), 0);
    const respMissing = turnos.filter(needsResponsible).length;
    const incomplete = turnos.filter(t => (Number(t.plazas_disponibles) || 0) > 0).length;
    const pct = total > 0 ? Math.round((occupied / total) * 100) : 0;
    return { total, occupied, free, respMissing, incomplete, pct };
  }

  function needsResponsible(t) {
    return (Number(t.plazas_responsable) || 0) > 0 && (Number(t.plazas_responsable_disponibles) || 0) > 0;
  }

  function renderSummary(days, dayKeys) {
    const stats = getStats(allTurnos);
    const urgency = buildUrgency(allTurnos, 10);
    const dayCards = dayKeys.map(k => ({ key:k, day:days[k], stats:getStats(days[k].turnos) }));
    document.getElementById('summaryView').innerHTML = `
      <section class="kpi-grid">
        <div class="kpi blue"><div class="kpi-label">Personas apuntadas</div><div class="kpi-value">${stats.occupied}/${stats.total}</div><div class="kpi-sub">${stats.pct}% de cobertura total</div></div>
        <div class="kpi ${stats.free ? 'warn' : 'ok'}"><div class="kpi-label">Plazas libres</div><div class="kpi-value">${stats.free}</div><div class="kpi-sub">en ${stats.incomplete} turnos con huecos</div></div>
        <div class="kpi ${stats.respMissing ? 'danger' : 'ok'}"><div class="kpi-label">Responsables pendientes</div><div class="kpi-value">${stats.respMissing}</div><div class="kpi-sub">${stats.respMissing ? 'prioridad máxima' : 'todos cubiertos'}</div></div>
        <div class="kpi"><div class="kpi-label">Días / turnos</div><div class="kpi-value">${dayKeys.length}/${allTurnos.length}</div><div class="kpi-sub">seguimiento general</div></div>
      </section>

      <section class="dashboard-grid">
        <div class="panel">
          <h2>Mapa de cobertura por día</h2>
          <p class="panel-help">Lectura rápida: porcentaje cubierto, huecos y responsables pendientes. Pulsa un día para revisarlo en el listado.</p>
          <div class="day-map">
            ${dayCards.map(d => renderDayCard(d)).join('')}
          </div>
        </div>
        <div class="panel">
          <h2>Focos de acción</h2>
          <p class="panel-help">Ordenado por urgencia: primero responsables pendientes, después turnos con menor cobertura y más huecos.</p>
          <div class="tools-row">
            <button class="copy-btn primary" onclick="copyCriticalReminder()">Copiar WhatsApp de lo urgente</button>
            <button class="copy-btn" onclick="setView('list')">Ver listado completo</button>
          </div>
          <div class="urgent-list">
            ${urgency.length ? urgency.map((item, idx) => renderUrgencyCard(item, idx)).join('') : '<div class="empty-ok">✔ No hay focos urgentes. Los turnos están bien cubiertos.</div>'}
          </div>
        </div>
      </section>`;
  }

  function renderDayCard(d) {
    const level = d.stats.pct < 50 || d.stats.respMissing >= 2 ? 'danger' : d.stats.pct < 75 || d.stats.respMissing > 0 ? 'warn' : '';
    return `<button class="day-card ${d.key === activeDayKey ? 'active' : ''}" onclick="goToDay('${escAttr(d.key)}')">
      <div class="day-card-head"><span class="day-card-title">${escHtml(d.day.dia)}</span><span class="day-card-date">${formatDate(d.key)}</span></div>
      <div class="progress"><span class="${level}" style="width:${d.stats.pct}%"></span></div>
      <div class="day-meta"><span><strong>${d.stats.pct}%</strong> cubierto</span><span>· faltan <strong>${d.stats.free}</strong></span><span>· resp. <strong>${d.stats.respMissing || 'OK'}</strong></span></div>
    </button>`;
  }

  function buildUrgency(turnos, max) {
    return turnos.map(t => {
      const plazas = Number(t.plazas) || 0;
      const occupied = Number(t.plazas_ocupadas) || 0;
      const free = Number(t.plazas_disponibles) || 0;
      const pct = plazas > 0 ? occupied / plazas : 1;
      const respMissing = needsResponsible(t);
      let score = 0;
      if (respMissing) score += 120;
      score += Math.round((1 - pct) * 70);
      score += Math.min(free, 8) * 4;
      return { t, plazas, occupied, free, pct, respMissing, score };
    }).filter(x => x.score >= 36)
      .sort((a,b) => b.score - a.score || String(a.t.fecha).localeCompare(String(b.t.fecha)) || String(a.t.hora_inicio).localeCompare(String(b.t.hora_inicio)))
      .slice(0, max);
  }

  function renderUrgencyCard(item, idx) {
    const t = item.t;
    const cls = item.respMissing ? 'high' : item.pct < .6 ? 'medium' : '';
    const pct = Math.round(item.pct * 100);
    return `<div class="urgent-card ${cls}">
      <span class="rank">${idx + 1}</span>
      <div>
        <div class="urgent-title">${escHtml(t.dia)} · ${escHtml(t.tipo)} ${escHtml(t.hora_inicio)}-${escHtml(t.hora_fin)}</div>
        <div class="urgent-sub">${formatDate(t.fecha)} · ${item.occupied}/${item.plazas} personas · ${pct}% cubierto</div>
      </div>
      <div class="tags">
        ${item.respMissing ? '<span class="tag danger">falta responsable</span>' : ''}
        ${item.free ? `<span class="tag warn">faltan ${item.free}</span>` : ''}
        <button class="copy-btn" onclick="copyShiftReminder('${escAttr(t.id_turno)}')">Copiar</button>
      </div>
    </div>`;
  }

  function renderList(days, dayKeys) {
    document.getElementById('listView').innerHTML = `
      <section class="tools-row">
        <button class="chip ${filterMode === 'all' ? 'active' : ''}" onclick="setFilter('all')">Todos</button>
        <button class="chip ${filterMode === 'missing' ? 'active' : ''}" onclick="setFilter('missing')">Con huecos</button>
        <button class="chip ${filterMode === 'responsible' ? 'active' : ''}" onclick="setFilter('responsible')">Sin responsable</button>
        <button class="copy-btn primary" onclick="copyActiveDayReminder()">Copiar WhatsApp del día</button>
      </section>
      <section class="list-layout">
        <aside class="panel side-nav">
          <h2>Días</h2>
          <p class="panel-help">Selecciona un día para revisar sus turnos y personas apuntadas.</p>
          <div class="day-tabs">
            ${dayKeys.map(k => renderDayTab(k, days[k])).join('')}
          </div>
        </aside>
        <div id="daySections">
          ${dayKeys.map(k => renderDaySection(k, days[k])).join('')}
        </div>
      </section>`;
    highlightActiveDay();
  }

  function renderDayTab(key, day) {
    const st = getStats(day.turnos);
    return `<button class="day-tab ${key === activeDayKey ? 'active' : ''}" onclick="goToDay('${escAttr(key)}')">
      ${escHtml(day.dia)}
      <small>${formatDate(key)} · faltan ${st.free} · resp. ${st.respMissing || 'OK'}</small>
    </button>`;
  }

  function renderDaySection(key, day) {
    return `<div class="day-section" data-key="${escAttr(key)}">
      <div class="day-header"><span class="day-title">${escHtml(day.dia)}</span><span class="day-date">${formatDate(key)}</span></div>
      <div class="shifts-grid">${day.turnos.map(renderShift).join('')}</div>
    </div>`;
  }

  function renderShift(t) {
    const plazas = Number(t.plazas) || 0;
    const ocupadas = Number(t.plazas_ocupadas) || 0;
    const libres = Number(t.plazas_disponibles) || 0;
    const pct = plazas > 0 ? Math.round((ocupadas / plazas) * 100) : 0;
    const fillClass = pct < 50 ? 'danger' : pct < 75 ? 'warn' : '';
    const plazasResp = Number(t.plazas_responsable) || 0;
    const needsPeople = libres > 0;
    const needsResp = needsResponsible(t);
    const statusClass = needsResp ? 'danger' : needsPeople ? 'warn' : 'ok';
    const statusText = needsResp ? 'Falta responsable' : needsPeople ? `Faltan ${libres}` : 'Cubierto';
    const responsable = (t.inscritos || []).find(i => yes(i.responsable_turno));
    const resto = (t.inscritos || []).filter(i => !yes(i.responsable_turno));
    const rows = [];
    if (plazasResp > 0) rows.push(responsable ? {type:'resp', persona:responsable} : {type:'empty-resp'});
    resto.forEach(p => rows.push({type:'filled', persona:p}));
    const slotsRegular = Math.max(plazas - plazasResp, 0);
    const emptyRegular = Math.max(slotsRegular - resto.length, 0);
    for (let i=0; i<emptyRegular; i++) rows.push({type:'empty'});
    let num = 0;
    const tableRows = rows.map(row => {
      num++;
      if (row.type === 'resp') return `<tr class="row-resp"><td class="num">${num}</td><td class="name">${escHtml(row.persona.nombre)} <span class="resp-badge">⭐ Responsable</span></td></tr>`;
      if (row.type === 'empty-resp') return `<tr class="row-empty-resp"><td class="num">${num}</td><td class="name">— plaza libre — <span class="missing-badge">⚠ Responsable</span></td></tr>`;
      if (row.type === 'filled') return `<tr class="row-filled"><td class="num">${num}</td><td class="name">${escHtml(row.persona.nombre)}</td></tr>`;
      return `<tr class="row-empty"><td class="num">${num}</td><td class="name">— libre —</td></tr>`;
    }).join('');
    const respCubierto = plazasResp > 0 && !needsResp;
    return `<div class="shift-col ${needsResp ? 'need-resp' : ''}" data-needs-people="${needsPeople ? '1':'0'}" data-needs-responsible="${needsResp ? '1':'0'}">
      <div class="shift-head"><span class="shift-tipo">${escHtml(t.tipo)}</span><span class="shift-hours">${escHtml(t.hora_inicio)} – ${escHtml(t.hora_fin)}</span><span class="status-badge ${statusClass}">${escHtml(statusText)}</span></div>
      <div class="shift-progress"><div class="progress"><span class="${fillClass}" style="width:${pct}%"></span></div><div class="progress-label">${ocupadas} / ${plazas} personas · ${pct}%</div></div>
      <table class="people-table">${tableRows}</table>
      ${needsPeople ? `<div class="shift-actions"><button class="copy-btn" onclick="copyShiftReminder('${escAttr(t.id_turno)}')">Copiar WhatsApp de este turno</button></div>` : ''}
      <div class="shift-footer">
        <span class="${libres === 0 ? 'ok' : libres <= 3 ? 'warn' : 'danger'}">Libres: <strong>${libres}</strong></span>
        ${plazasResp > 0 ? `<span class="${respCubierto ? 'ok' : 'danger'}">Responsable: <strong>${respCubierto ? '✔ Cubierto' : '✘ Falta'}</strong></span>` : ''}
        <span>Necesarias: <strong>${plazas}</strong></span><span>Apuntadas: <strong>${ocupadas}</strong></span>
      </div>
    </div>`;
  }

  function goToDay(key) {
    activeDayKey = key;
    render(allTurnos);
    setView(currentView === 'summary' ? 'list' : currentView);
  }

  function highlightActiveDay() {
    document.querySelectorAll('.day-section').forEach(el => el.classList.toggle('visible', el.dataset.key === activeDayKey));
    document.querySelectorAll('.day-tab').forEach(btn => btn.classList.toggle('active', btn.textContent.includes(formatDate(activeDayKey))));
    applyFilter();
  }

  function setFilter(mode) {
    filterMode = mode;
    document.querySelectorAll('.chip').forEach(btn => {
      const txt = btn.textContent.toLowerCase();
      btn.classList.toggle('active', (mode === 'all' && txt.includes('todos')) || (mode === 'missing' && txt.includes('huecos')) || (mode === 'responsible' && txt.includes('responsable')));
    });
    applyFilter();
  }

  function applyFilter() {
    document.querySelectorAll('.shift-col').forEach(card => {
      const needsPeople = card.dataset.needsPeople === '1';
      const needsResp = card.dataset.needsResponsible === '1';
      const hide = (filterMode === 'missing' && !needsPeople) || (filterMode === 'responsible' && !needsResp);
      card.classList.toggle('hidden-by-filter', hide);
    });
  }

  function getTurnoById(id) { return allTurnos.find(t => String(t.id_turno) === String(id)); }

  function copyActiveDayReminder() {
    const turnosDia = allTurnos.filter(t => String(t.fecha) === String(activeDayKey) && (Number(t.plazas_disponibles) || 0) > 0);
    copyText(buildReminderText(turnosDia));
  }

  function copyCriticalReminder() {
    const urgent = buildUrgency(allTurnos, 8).map(x => x.t);
    copyText(buildReminderText(urgent));
  }

  function copyShiftReminder(idTurno) {
    const t = getTurnoById(idTurno);
    copyText(buildReminderText(t ? [t] : []));
  }

  function getPublicShiftUrl(t) {
    const url = new URL('index.html', window.location.href);
    if (t && t.id_turno) url.searchParams.set('turno', t.id_turno);
    url.searchParams.set('apuntar', '1');
    return url.toString();
  }

  function buildReminderText(turnos) {
    if (!turnos.length) return 'Ahora mismo no hay plazas libres en los turnos seleccionados. Eskerrik asko!';
    const lines = turnos.map(t => {
      const libres = Number(t.plazas_disponibles) || 0;
      const resp = needsResponsible(t) ? ' · falta responsable' : '';
      return `• ${t.dia} ${formatDate(t.fecha)} · ${t.tipo} ${t.hora_inicio}-${t.hora_fin}: faltan ${libres} persona(s)${resp}\n  Apúntate aquí: ${getPublicShiftUrl(t)}`;
    });
    return `Kaixo! Necesitamos ayuda para cubrir turnos de la barraka de la ikastola:\n\n${lines.join('\n\n')}\n\nMila esker!`;
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      alert('Texto copiado. Ya puedes pegarlo en WhatsApp, email o el grupo que quieras.');
    } catch (err) {
      window.prompt('Copia este texto:', text);
    }
  }

  function yes(v) { return ['si','sí','s','true','1','yes'].includes(String(v || '').trim().toLowerCase()); }
  function escHtml(v) { return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
  function escAttr(v) { return escHtml(v).replace(/`/g,'&#096;'); }
  function formatDate(dateStr) {
    if (!dateStr) return '';
    try {
      let d;
      if (/^\d{2}\/\d{2}\/\d{4}$/.test(dateStr)) { const [dd, mm, yyyy] = dateStr.split('/'); d = new Date(`${yyyy}-${mm}-${dd}T00:00:00`); }
      else { d = new Date(`${dateStr}T00:00:00`); if (Number.isNaN(d.getTime())) d = new Date(dateStr); }
      if (Number.isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString('es-ES', { day:'numeric', month:'long', year:'numeric' });
    } catch { return dateStr; }
  }
</script>
</body>
